<!DOCTYPE html><html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorCheck AI</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, "Noto Sans Myanmar", sans-serif;
}

body {
  background: #0f1117;
  color: white;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.header {
  text-align: center;
  padding: 35px 10px;
}

.logo {
  font-size: 45px;
  margin-bottom: 10px;
}

h1 {
  font-size: 32px;
  margin-bottom: 12px;
}

.header p {
  color: #aeb4c0;
  line-height: 1.8;
}

.card {
  background: #181b24;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 20px;
  border: 1px solid #292d38;
}

.card-title {
  margin-bottom: 20px;
}

.input-section {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 9px;
  color: #c8ccd5;
  font-weight: bold;
}

input[type="url"] {
  width: 100%;
  padding: 15px;
  border-radius: 11px;
  border: 1px solid #363b48;
  background: #101219;
  color: white;
  font-size: 15px;
}

.upload-box {
  border: 2px dashed #363b48;
  background: #101219;
  border-radius: 14px;
  padding: 25px 15px;
  text-align: center;
  cursor: pointer;
}

.upload-icon {
  font-size: 35px;
  margin-bottom: 8px;
}

.upload-text {
  color: #c8ccd5;
  margin-bottom: 5px;
}

.upload-hint {
  color: #777d89;
  font-size: 12px;
}

#videoFile {
  display: none;
}

#fileName {
  margin-top: 12px;
  color: #aeb4c0;
  font-size: 13px;
  word-break: break-word;
}

.analyze-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 11px;
  background: #6c5ce7;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.analyze-btn:disabled {
  background: #454052;
}

#loading {
  display: none;
  text-align: center;
}

#result {
  display: none;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #363b48;
  border-top: 4px solid #6c5ce7;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.result-box {
  background: #101219;
  padding: 17px;
  border-radius: 12px;
  margin-top: 12px;
  border-left: 4px solid #6c5ce7;
}

.result-box h3 {
  margin-bottom: 9px;
}

.result-box p {
  color: #c8ccd5;
  line-height: 1.8;
}

.notice {
  border-left-color: #ffd166;
}

.footer {
  text-align: center;
  color: #777d89;
  font-size: 12px;
  padding: 20px;
}
</style></head><body><div class="container">  <div class="header">
    <div class="logo">🎬</div><h1>CreatorCheck AI</h1>

<p>
  သင့်ဗီဒီယိုကို ငွေရှာနိုင်ခြေ၊
  မူပိုင်ခွင့်နှင့် မူရင်းအကြောင်းအရာ
  အန္တရာယ်များအတွက် AI ဖြင့် ခန့်မှန်းစစ်ဆေးပါ။
</p>

  </div>  <div class="card"><h2 class="card-title">
  🔍 သင့်ဗီဒီယိုကို စစ်ဆေးပါ
</h2>

<div class="input-section">

  <label>🔗 ဗီဒီယိုလင့်ခ်</label>

  <input
    type="url"
    id="videoLink"
    placeholder="YouTube သို့မဟုတ် TikTok ဗီဒီယိုလင့်ခ် ထည့်ပါ..."
  >

</div>


<div class="input-section">

  <label>📹 ဗီဒီယိုဖိုင်တင်ရန်</label>

  <label for="videoFile" class="upload-box">

    <div class="upload-icon">☁️</div>

    <div class="upload-text">
      ဗီဒီယိုဖိုင်ရွေးရန် နှိပ်ပါ
    </div>

    <div class="upload-hint">
      MP4, MOV, AVI နှင့် အခြားဗီဒီယိုဖိုင်များ
    </div>

    <div id="fileName">
      ဗီဒီယိုဖိုင် ရွေးချယ်ထားခြင်းမရှိသေးပါ
    </div>

  </label>

  <input
    type="file"
    id="videoFile"
    accept="video/*"
    onchange="showFileName()"
  >

</div>


<button
  class="analyze-btn"
  id="analyzeBtn"
  onclick="analyzeVideo()"
>
  🤖 ဗီဒီယိုကို စစ်ဆေးမည်
</button>

  </div>  <div class="card" id="loading"><div class="spinner"></div>

<p>
  🤖 AI Server သို့ ဆက်သွယ်နေပါသည်...
</p>

  </div>  <div class="card" id="result"></div>  <div class="footer">
    CreatorCheck AI © 2026
  </div></div><script>

function showFileName() {

  const file =
    document.getElementById("videoFile").files[0];

  const fileName =
    document.getElementById("fileName");

  if (file) {

    fileName.innerHTML =
      "✅ ရွေးချယ်ထားသောဖိုင် - " + file.name;

  } else {

    fileName.innerHTML =
      "ဗီဒီယိုဖိုင် ရွေးချယ်ထားခြင်းမရှိသေးပါ";

  }

}


async function analyzeVideo() {

  const link =
    document.getElementById("videoLink").value.trim();

  const file =
    document.getElementById("videoFile").files[0];

  const result =
    document.getElementById("result");

  const loading =
    document.getElementById("loading");

  const button =
    document.getElementById("analyzeBtn");


  if (link === "" && !file) {

    alert(
      "ကျေးဇူးပြု၍ YouTube/TikTok Link ထည့်ပါ သို့မဟုတ် Video File တင်ပါ။"
    );

    return;

  }


  result.style.display = "none";

  loading.style.display = "block";

  button.disabled = true;

  button.innerHTML =
    "⏳ စစ်ဆေးနေပါသည်...";


  try {

    const formData =
      new FormData();


    if (link !== "") {

      formData.append(
        "videoLink",
        link
      );

    }


    if (file) {

      formData.append(
        "videoFile",
        file
      );

    }


    /*
      IMPORTANT:
      ဒီ URL က Railway Backend API ဖြစ်ပါတယ်။
      Homepage URL မဟုတ်ပါ။
    */

    const API_URL =
      "https://creatorcheck-ai-production.up.railway.app/analyze";


    const response =
      await fetch(
        API_URL,
        {
          method: "POST",
          body: formData
        }
      );


    if (!response.ok) {

      throw new Error(
        "Server Error: " +
        response.status
      );

    }


    const data =
      await response.json();


    loading.style.display =
      "none";


    result.style.display =
      "block";


    result.innerHTML = `

      <div class="result-box">

        <h3>
          📊 စစ်ဆေးမှုရလဒ်
        </h3>

        <p>
          ${data.message || "AI စစ်ဆေးမှု ပြီးပါပြီ။"}
        </p>

      </div>


      <div class="result-box">

        <h3>
          💰 ငွေရှာနိုင်ခြေ
        </h3>

        <p>
          ${data.monetization || "အချက်အလက် မရရှိသေးပါ။"}
        </p>

      </div>


      <div class="result-box">

        <h3>
          ©️ မူပိုင်ခွင့်အန္တရာယ်
        </h3>

        <p>
          ${data.copyright || "အချက်အလက် မရရှိသေးပါ။"}
        </p>

      </div>


      <div class="result-box">

        <h3>
          🔄 Reused Content
        </h3>

        <p>
          ${data.reusedContent || "အချက်အလက် မရရှိသေးပါ။"}
        </p>

      </div>


      <div class="result-box">

        <h3>
          💡 အကြံပြုချက်
        </h3>

        <p>
          ${data.recommendation || "ကိုယ်ပိုင် Commentary၊ Voice-over နှင့် Editing များ ထည့်သွင်းရန် အကြံပြုပါသည်။"}
        </p>

      </div>


      <div class="result-box notice">

        <h3>
          ⚠️ သတိပေးချက်
        </h3>

        <p>
          ဤရလဒ်သည် Demo AI Risk Assessment ဖြစ်ပါသည်။
          Monetization အတည်ပြုချက် သို့မဟုတ် Copyright ကင်းရှင်းမှုကို အာမခံပေးခြင်း မရှိပါ။
        </p>

      </div>

    `;


    result.scrollIntoView({
      behavior: "smooth"
    });


  }

  catch (error) {

    console.error(error);


    loading.style.display =
      "none";


    result.style.display =
      "block";


    result.innerHTML = `

      <div class="result-box notice">

        <h3>
          ❌ Server ချိတ်ဆက်မှု မအောင်မြင်ပါ
        </h3>

        <p>
          Railway Backend ကို ချိတ်ဆက်၍ မရပါ။
        </p>

        <p>
          Error: ${error.message}
        </p>

      </div>

    `;

  }


  button.disabled =
    false;

  button.innerHTML =
    "🤖 ဗီဒီယိုကို စစ်ဆေးမည်";

}

</script></body>
  </html>
