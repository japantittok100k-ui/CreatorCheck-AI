<!DOCTYPE html>
<html lang="my">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CreatorCheck AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, "Noto Sans Myanmar", sans-serif;
    }

    body {
      background: #0f1117;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 35px 10px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      color: #aeb4c0;
      font-size: 15px;
      line-height: 1.7;
    }

    .card {
      background: #181b24;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      border: 1px solid #292d38;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .card-title {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .input-section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #c8ccd5;
      font-size: 14px;
      font-weight: bold;
    }

    input[type="url"] {
      width: 100%;
      padding: 15px;
      border-radius: 11px;
      border: 1px solid #363b48;
      background: #101219;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input[type="url"]:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
    }

    .upload-box {
      border: 2px dashed #363b48;
      background: #101219;
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
    }

    .upload-box:hover {
      border-color: #6c5ce7;
      background: #131620;
    }

    .upload-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #c8ccd5;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .upload-hint {
      color: #777d89;
      font-size: 12px;
    }

    #videoFile {
      display: none;
    }

    #fileName {
      margin-top: 12px;
      color: #aeb4c0;
      font-size: 13px;
      word-break: break-word;
    }

    .analyze-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 11px;
      background: #6c5ce7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .analyze-btn:hover {
      background: #5b4bd6;
    }

    .analyze-btn:disabled {
      background: #454052;
      cursor: not-allowed;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 25px 10px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #363b48;
      border-top: 4px solid #6c5ce7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #c8ccd5;
      font-size: 14px;
      line-height: 1.8;
    }

    #result {
      display: none;
    }

    .result-header {
      margin-bottom: 18px;
    }

    .result-header h2 {
      margin-bottom: 7px;
    }

    .result-header p {
      color: #777d89;
      font-size: 13px;
      line-height: 1.7;
    }

    .result-box {
      background: #101219;
      padding: 17px;
      border-radius: 12px;
      margin-top: 12px;
      border-left: 4px solid #6c5ce7;
    }

    .result-box h3 {
      margin-bottom: 9px;
      font-size: 16px;
    }

    .result-box p {
      color: #c8ccd5;
      line-height: 1.8;
      font-size: 14px;
    }

    .notice {
      border-left-color: #ffd166;
    }

    .error {
      border-left-color: #ff5c5c;
    }

    .footer {
      text-align: center;
      color: #777d89;
      font-size: 12px;
      padding: 20px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      🎬
    </div>

    <h1>
      CreatorCheck AI
    </h1>

    <p>
      သင့်ဗီဒီယိုကို ငွေရှာနိုင်ခြေ၊
      မူပိုင်ခွင့်နှင့် မူရင်းအကြောင်းအရာ
      အန္တရာယ်များအတွက် AI ဖြင့် ခန့်မှန်းစစ်ဆေးပါ။
    </p>

  </div>


  <!-- ANALYZE CARD -->

  <div class="card">

    <h2 class="card-title">
      🔍 သင့်ဗီဒီယိုကို စစ်ဆေးပါ
    </h2>


    <!-- LINK -->

    <div class="input-section">

      <label>
        🔗 ဗီဒီယိုလင့်ခ်
      </label>

      <input
        type="url"
        id="videoLink"
        placeholder="YouTube သို့မဟုတ် TikTok ဗီဒီယိုလင့်ခ် ထည့်ပါ..."
      >

    </div>


    <!-- VIDEO FILE -->

    <div class="input-section">

      <label>
        📹 ဗီဒီယိုဖိုင်တင်ရန်
      </label>

      <label
        for="videoFile"
        class="upload-box"
      >

        <div class="upload-icon">
          ☁️
        </div>

        <div class="upload-text">
          ဗီဒီယိုဖိုင်ရွေးရန် နှိပ်ပါ
        </div>

        <div class="upload-hint">
          MP4, MOV, AVI နှင့် အခြားဗီဒီယိုဖိုင်များ
        </div>

        <div id="fileName">
          ဗီဒီယိုဖိုင် ရွေးချယ်ထားခြင်းမရှိသေးပါ
        </div>

      </label>

      <input
        type="file"
        id="videoFile"
        accept="video/*"
        onchange="showFileName()"
      >

    </div>


    <!-- BUTTON -->

    <button
      class="analyze-btn"
      id="analyzeBtn"
      onclick="analyzeVideo()"
    >
      🤖 ဗီဒီယိုကို စစ်ဆေးမည်
    </button>

  </div>


  <!-- LOADING -->

  <div
    class="card"
    id="loading"
  >

    <div class="spinner"></div>

    <p class="loading-text">
      🤖 AI က သင့်ဗီဒီယိုကို စစ်ဆေးနေပါသည်...
    </p>

    <p class="loading-text">
      ခဏစောင့်ပေးပါ။
    </p>

  </div>


  <!-- RESULT -->

  <div
    class="card"
    id="result"
  >

  </div>


  <!-- FOOTER -->

  <div class="footer">
    CreatorCheck AI © 2026
  </div>


</div>


<script>


// ================================
// FILE NAME
// ================================

function showFileName() {

  const file =
    document.getElementById("videoFile").files[0];

  const fileName =
    document.getElementById("fileName");


  if (file) {

    fileName.innerHTML =
      "✅ ရွေးချယ်ထားသောဖိုင် - " +
      file.name;

  }

  else {

    fileName.innerHTML =
      "ဗီဒီယိုဖိုင် ရွေးချယ်ထားခြင်းမရှိသေးပါ";

  }

}



// ================================
// AI VIDEO ANALYSIS
// ================================

async function analyzeVideo() {


  const link =
    document
      .getElementById("videoLink")
      .value
      .trim();


  const file =
    document
      .getElementById("videoFile")
      .files[0];


  const result =
    document.getElementById("result");


  const loading =
    document.getElementById("loading");


  const button =
    document.getElementById("analyzeBtn");



  // CHECK INPUT

  if (
    link === "" &&
    !file
  ) {

    alert(
      "ကျေးဇူးပြု၍ ဗီဒီယိုလင့်ခ်ထည့်ပါ သို့မဟုတ် ဗီဒီယိုဖိုင်တင်ပါ။"
    );

    return;

  }



  // HIDE OLD RESULT

  result.style.display =
    "none";



  // SHOW LOADING

  loading.style.display =
    "block";


  button.disabled =
    true;


  button.innerHTML =
    "⏳ AI က စစ်ဆေးနေပါသည်...";



  try {


    // FORM DATA

    const formData =
      new FormData();



    // VIDEO LINK

    if (link !== "") {

      formData.append(
        "videoLink",
        link
      );

    }



    // VIDEO FILE

    if (file) {

      formData.append(
        "videoFile",
        file
      );

    }



    // BACKEND REQUEST

    const response =
      await fetch(

        "https://creatorcheck-ai-production.up.railway.app/analyze",

        {

          method:
            "POST",

          body:
            formData

        }

      );



    // SERVER ERROR

    if (!response.ok) {

      throw new Error(
        "Server Error: " +
        response.status
      );

    }



    // JSON RESULT

    const data =
      await response.json();



    // API ERROR

    if (!data.success) {

      throw new Error(
        data.message ||
        "AI Analysis မအောင်မြင်ပါ။"
      );

    }



    // HIDE LOADING

    loading.style.display =
      "none";



    // SHOW RESULT

    result.style.display =
      "block";



    result.innerHTML = `

      <div class="result-header">

        <h2>
          📊 AI စစ်ဆေးမှုရလဒ်
        </h2>

        <p>
          🤖 CreatorCheck AI မှ
          ခွဲခြမ်းစိတ်ဖြာထားသော
          Risk Assessment ရလဒ်ဖြစ်ပါသည်။
        </p>

      </div>


      <div class="result-box">

        <h3>
          💰 ငွေရှာနိုင်ခြေ
        </h
